[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "civicflow-ai-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "langgraph>=0.2,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "faiss-cpu>=1.8,<2",
  "PyMuPDF>=1.24,<2",
  "Pillow>=10,<13",
  "sentence-transformers>=3,<6",
  "civicflow-contracts",
]
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.uv.sources]
civicflow-contracts = { path = "../../contracts/civicflow_contracts", editable = true }
