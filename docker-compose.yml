services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://civicflow:civicflow@db:5432/civicflow}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-}
      APP_ENV: ${APP_ENV:-development}
      DOCUMENT_STORAGE_DIR: /data/documents
      BROWSER_WORKER_URL: ${BROWSER_WORKER_URL:-http://browser-worker:8001}
      BROWSER_WORKER_API_TOKEN: ${BROWSER_WORKER_API_TOKEN:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-nemotron-3-super:cloud}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_ALLOW_DOCUMENT_DATA: ${OPENAI_ALLOW_DOCUMENT_DATA:-false}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_CHAT_COMPLETIONS_URL: ${LLM_CHAT_COMPLETIONS_URL:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-sentence_transformers}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-auto}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      EMBEDDING_ALLOW_DOWNLOAD: ${EMBEDDING_ALLOW_DOWNLOAD:-false}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_URL: ${EMBEDDING_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      browser-worker:
        condition: service_started
    volumes:
      - civicflow-documents:/data/documents
      - civicflow-model-cache:/root/.cache/huggingface

  browser-worker:
    build:
      context: .
      dockerfile: browser_worker/Dockerfile
    environment:
      BROWSER_WORKER_API_TOKEN: ${BROWSER_WORKER_API_TOKEN:-}
      BROWSER_ALLOWED_DOMAINS: ${BROWSER_ALLOWED_DOMAINS:-}
      BROWSER_FILE_REFERENCE_DOMAINS: ${BROWSER_FILE_REFERENCE_DOMAINS:-}
      BROWSER_SESSION_TTL_SECONDS: ${BROWSER_SESSION_TTL_SECONDS:-1800}
    ports:
      - "8001:8001"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: civicflow
      POSTGRES_USER: civicflow
      POSTGRES_PASSWORD: civicflow
    ports:
      - "5432:5432"
    volumes:
      - civicflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicflow -d civicflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  civicflow-postgres:
  civicflow-documents:
  civicflow-model-cache:
