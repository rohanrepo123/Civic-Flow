[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "civicflow"
version = "0.1.0"
description = "Controlled public-service application assistance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "email-validator>=2.2,<3",
  "httpx>=0.27,<1",
  "langgraph>=0.2,<2",
  "langgraph-checkpoint-postgres>=2,<4",
  "pydantic>=2.8,<3",
  "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-asyncio>=0.24,<2"]
rag = ["PyMuPDF>=1.24,<2", "faiss-cpu>=1.8,<2", "numpy>=1.26,<3"]
embeddings = ["sentence-transformers>=3,<6"]
browser = ["playwright>=1.48,<2"]

[tool.setuptools]
package-dir = {"civicflow_contracts" = "packages/civicflow_contracts/civicflow_contracts"}

[tool.setuptools.packages.find]
where = ["packages/civicflow_contracts"]

[tool.pytest.ini_options]
pythonpath = [".", "packages/civicflow_contracts"]
testpaths = ["tests", "backend/tests", "browser_worker/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
